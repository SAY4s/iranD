<!DOCTYPE html>
<html lang="fa" dir="rtl" data-level="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c12">
<title>جزوه امتحان | ایران دیجیتال</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
@property --a1{syntax:"<color>";inherits:true;initial-value:#38bdf8}
@property --a2{syntax:"<color>";inherits:true;initial-value:#6366f1}

:root{
  color-scheme:dark;
  --bg:#0a0c12; --ink:#e8ebf4; --muted:#98a0b8; --line:rgba(255,255,255,.09);
  --a1:#38bdf8; --a2:#6366f1;
  --ok:#4ade9a; --ok-bg:rgba(74,222,154,.10);
  --mono:"JetBrains Mono","Fira Code",Consolas,"Courier New",monospace;
  --r:20px;
  transition:--a1 .7s ease,--a2 .7s ease;
}
html[data-level="2"]{--a1:#c084fc;--a2:#f472b6}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 45% at 88% -8%,color-mix(in srgb,var(--a1) 26%,transparent),transparent 70%),
    radial-gradient(50% 40% at 4% 8%,color-mix(in srgb,var(--a2) 22%,transparent),transparent 70%),
    radial-gradient(40% 30% at 50% 110%,color-mix(in srgb,var(--a2) 14%,transparent),transparent 70%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(70% 50% at 50% 0%,#000,transparent 80%);
  mask-image:radial-gradient(70% 50% at 50% 0%,#000,transparent 80%);
}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:50;
  background:rgba(10,12,18,.72);
  -webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:14px}
.progress{height:2px;background:transparent}
.progress i{display:block;height:100%;width:100%;transform-origin:right;transform:scaleX(0);background:linear-gradient(90deg,var(--a2),var(--a1))}

/* ---------- level lever ---------- */
.switch{
  position:relative;display:grid;grid-template-columns:1fr 1fr;
  width:min(300px,100%);padding:4px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  box-shadow:inset 0 1px 6px rgba(0,0,0,.4);
}
.thumb{
  position:absolute;top:4px;bottom:4px;right:4px;width:calc(50% - 4px);border-radius:999px;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:0 6px 22px -4px color-mix(in srgb,var(--a1) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .55s cubic-bezier(.5,1.5,.4,1);
}
.switch[data-level="2"] .thumb{transform:translateX(-100%)}
.switch button{
  position:relative;z-index:1;appearance:none;border:0;background:none;cursor:pointer;
  font:inherit;color:var(--muted);padding:5px 8px;border-radius:999px;line-height:1.35;
  display:flex;flex-direction:column;align-items:center;transition:color .3s;
}
.switch button b{font-size:.88rem;font-weight:700}
.switch button small{font-size:.68rem;opacity:.85}
.switch button[aria-selected="true"]{color:#0b0d14}
.switch button:not([aria-selected="true"]):hover{color:var(--ink)}
.switch button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}

/* ---------- hero ---------- */
main{max-width:820px;margin:0 auto;padding:0 16px 40px;overflow-x:clip}
.hero{padding:44px 4px 18px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;padding:3px 12px;border-radius:999px;
  font-size:.78rem;color:var(--a1);border:1px solid color-mix(in srgb,var(--a1) 35%,transparent);
  background:color-mix(in srgb,var(--a1) 10%,transparent);
}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--a1);box-shadow:0 0 10px var(--a1)}
.hero h1{
  margin:14px 0 6px;font-size:clamp(1.8rem,5.5vw,2.7rem);line-height:1.35;font-weight:800;
  background:linear-gradient(120deg,#fff 20%,color-mix(in srgb,var(--a1) 80%,#fff) 60%,var(--a2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stat{
  display:flex;align-items:baseline;gap:8px;padding:8px 16px;border-radius:14px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
}
.stat b{font-size:1.25rem;font-weight:800;color:#fff}
.stat span{font-size:.8rem;color:var(--muted)}

/* ---------- question cards ---------- */
#list{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:10px}
.q{
  position:relative;min-width:0;padding:20px;border-radius:var(--r);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid var(--line);
  box-shadow:0 20px 40px -24px rgba(0,0,0,.8);
  transition:border-color .3s,transform .3s,box-shadow .3s;
}
.q:hover{border-color:color-mix(in srgb,var(--a1) 40%,transparent);transform:translateY(-2px);box-shadow:0 24px 50px -22px color-mix(in srgb,var(--a1) 30%,#000)}
.q-head{display:flex;gap:12px;align-items:flex-start}
.num{
  flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-weight:800;font-size:.95rem;color:#0b0d14;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:0 8px 20px -8px var(--a1);
}
.q-text{flex:1;min-width:0;margin:0;font-weight:500;padding-top:3px}
.pts{
  flex:none;margin-top:5px;padding:1px 10px;border-radius:999px;font-size:.74rem;white-space:nowrap;
  color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.04);
}

code{font-family:var(--mono);direction:ltr;unicode-bidi:embed}
.q-text code,.why code{
  background:rgba(255,255,255,.08);padding:1px 7px;border-radius:6px;font-size:.84em;
  border:1px solid rgba(255,255,255,.06);
}

/* code block */
.code{margin:16px 0 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#080a11;direction:ltr}
.code-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 10px 7px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line);
}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:#ff5f57}
.dots i:nth-child(2){background:#febc2e}
.dots i:nth-child(3){background:#28c840}
.lang{margin-right:auto;margin-left:12px;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.lang em{font-style:normal;margin-left:8px;padding:0 8px;border-radius:999px;font-family:Vazirmatn,sans-serif;font-size:.72rem;color:var(--ok);background:var(--ok-bg)}
.copy{
  display:inline-flex;align-items:center;gap:6px;appearance:none;cursor:pointer;
  font:inherit;font-size:.76rem;line-height:1.7;padding:2px 12px;border-radius:8px;
  color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);
  transition:background .2s,border-color .2s,color .2s;
}
.copy svg{width:14px;height:14px}
.copy:hover{background:rgba(255,255,255,.12);border-color:color-mix(in srgb,var(--a1) 50%,transparent)}
.copy.done{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
pre{
  margin:0;padding:14px 16px;overflow-x:auto;direction:ltr;text-align:left;
  font-size:.86rem;line-height:1.7;color:#d6dbea;
}
pre:focus-visible{outline:2px solid var(--a1);outline-offset:-2px}
.t-com{color:#667090;font-style:italic}
.t-str{color:#a6e07a}
.t-num{color:#ffa07a}
.t-kw{color:#c792ea}
.t-bi{color:#7fdbca}
.t-fn{color:#82aaff}
::selection{background:color-mix(in srgb,var(--a1) 45%,transparent)}

/* options */
.opts{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.opt{
  display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);color:#c4cadb;
}
.opt .ltr{
  flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  font-size:.75rem;font-weight:700;color:var(--muted);background:rgba(255,255,255,.06);
}
.opt code{flex:0 1 auto;min-width:0;font-size:.86rem;text-align:left;overflow-wrap:anywhere}
.opt.ok{
  color:var(--ok);font-weight:600;border-color:color-mix(in srgb,var(--ok) 55%,transparent);
  background:linear-gradient(90deg,var(--ok-bg),rgba(74,222,154,.03));
  box-shadow:0 0 0 1px rgba(74,222,154,.08),0 10px 28px -16px var(--ok);
}
.opt.ok .ltr{background:var(--ok);color:#06231a}
.ok-tag{flex:none;margin-inline-start:auto;font-size:.72rem;padding:0 10px;border-radius:999px;color:#06231a;background:var(--ok);font-weight:700}

/* output + note */
.out{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#080a11;direction:ltr}
.out-h{padding:3px 14px;font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line);font-family:var(--mono)}
.out-b{padding:9px 14px;font-family:var(--mono);font-size:.86rem;color:#f4f7ff;white-space:pre-wrap;word-break:break-word}
.out-b::before{content:"› ";color:var(--ok)}
.why{
  display:flex;gap:12px;margin-top:14px;padding:12px 14px;border-radius:14px;font-size:.92rem;color:#cdd3e4;
  background:linear-gradient(90deg,color-mix(in srgb,var(--a1) 13%,transparent),color-mix(in srgb,var(--a2) 5%,transparent));
  border:1px solid color-mix(in srgb,var(--a1) 22%,transparent);
}
.why svg{flex:none;width:20px;height:20px;margin-top:5px;color:var(--a1)}
.why b{color:var(--a1)}

/* next level + footer */
.next{display:flex;justify-content:center;margin-top:30px}
.next button{
  appearance:none;cursor:pointer;font:inherit;font-weight:700;color:#0b0d14;
  padding:12px 26px;border-radius:999px;border:0;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:0 14px 34px -12px var(--a1);transition:transform .25s,box-shadow .25s;
}
.next button:hover{transform:translateY(-3px);box-shadow:0 20px 40px -12px var(--a1)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 16px 50px}
.credit{margin-top:8px;font-size:.9rem}
.credit b{background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.enter .hero>*,.enter .q,.enter .next{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.enter .hero>*:nth-child(2){animation-delay:.05s}
.enter .hero>*:nth-child(3){animation-delay:.1s}
.enter .hero>*:nth-child(4){animation-delay:.15s}
.enter .q{animation-delay:calc(var(--i,0)*45ms + .15s)}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

@media (max-width:560px){
  .top-in{padding:10px 12px}
  .switch{width:100%}
  .q{padding:16px}
  .hero{padding-top:30px}
  .q-head{flex-wrap:wrap}
  .pts{order:3;margin-right:50px;margin-top:-4px}
}

@media print{
  body{background:#fff;color:#000}
  body::before,body::after,.top,.next,.copy,.dots{display:none}
  .q{break-inside:avoid;background:#fff;border-color:#bbb;box-shadow:none}
  .hero h1{color:#111;background:none}
  .code,.out{background:#f3f4f8}
  pre,.out-b,.opt,.why,.q-text{color:#111}
  .t-com,.t-str,.t-num,.t-kw,.t-bi,.t-fn{color:#111}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="switch" id="switch" role="tablist" aria-label="انتخاب سطح" data-level="1">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" role="tab" data-lv="1" aria-selected="true"><b>سطح ۱</b><small>مقدماتی</small></button>
      <button type="button" role="tab" data-lv="2" aria-selected="false"><b>سطح ۲</b><small>نهایی</small></button>
    </div>
  </div>
  <div class="progress"><i id="bar"></i></div>
</header>

<main id="app"></main>
<footer>این جزوه برای مرور شخصی ساخته شده است.<div class="credit">جمع‌آوری شده توسط <b>محمدحسین محمدبیگی</b></div></footer>

<script>
/* ========== داده‌ی سوال‌ها ========== */
const Q1 = [
{t:"کدوم یک از گزینه‌های زیر، تعداد عناصر لیست <code>[1, 2, 3, 4, 5]</code> رو به درستی محاسبه می‌کنه؟",p:3,
 o:["length([1, 2, 3, 4, 5])","items([1, 2, 3, 4, 5])","len([1, 2, 3, 4, 5])","itm([1, 2, 3, 4, 5])"],a:2,
 w:"تابع داخلی پایتون برای شمردن عناصر <code>len()</code> هست و روی لیست، رشته، دیکشنری و تاپل کار می‌کنه."},

{t:"دستور <code>print</code> نوشته شده در کد زیر چند بار اجرا میشه؟",p:5,
 code:`for i in range(10):
    for j in range(10):
        for k in range(5):
            print("Hello World")`,
 o:["1000","5000","100","500"],a:3,
 w:"در حلقه‌های تو در تو، تعداد اجرا برابر حاصل‌ضرب تکرارهاست: <code>10 × 10 × 5 = 500</code>."},

{t:"با اجرا کردن کد زیر چه چیزی در خروجی چاپ میشه؟",p:3,
 code:`counter = 1

while counter <= 10:
    print(1)
    counter -= 1
else:
    print("done")`,
 o:["اعداد 1 تا 10 و در آخر رشته done در خروجی چاپ میشن.","اعداد 10 تا 1 و در آخر رشته done در خروجی چاپ میشن.","کد خطا داره و اصلاً اجرا نمیشه.","حلقه بی‌نهایته و تا ابد 1 در خروجی چاپ میشه."],a:3,
 w:"به‌جای <code>+= 1</code> نوشته شده <code>-= 1</code>، پس <code>counter</code> هر بار کمتر میشه و شرط <code>counter &lt;= 10</code> همیشه درست می‌مونه. حلقه هیچ‌وقت تموم نمیشه و <code>else</code> هم اجرا نمیشه."},

{t:"برنامه‌ی پیشنهاد نام کاربری: نام و سن رو بگیر و با <code>_</code> بینشون و <code>!</code> در آخر، نام کاربری بساز و چاپ کن. (مثلاً <code>\"nina_24!\"</code>)",p:6,
 code:`name = input("نام: ")
age = input("سن: ")

username = name + "_" + age + "!"

print(username)`,
 w:"خروجی <code>input()</code> همیشه رشته‌ست، پس نیازی به تبدیل <code>age</code> به عدد نیست و با <code>+</code> مستقیم می‌چسبه. اگه می‌خواستی عدد باشه، باید با <code>str()</code> تبدیلش می‌کردی."},

{t:"کدوم یک از گزینه‌های زیر برای حذف کردن یک عنصر از دیکشنری استفاده <b>نمیشه</b>؟",p:3,
 o:["del","pop","popitem","remove"],a:3,
 w:"دیکشنری متد <code>remove</code> نداره. روش‌های درست: <code>del d[key]</code>، <code>d.pop(key)</code> و <code>d.popitem()</code> (آخرین عنصر رو حذف می‌کنه). <code>remove</code> مخصوص لیست‌هاست."},

{t:"با توجه به دیکشنری زیر، اجرای کدوم قطعه کد با مشکل مواجه میشه؟",p:4,
 code:`user_data = {
  "user_name": "dracula",
  "password": "secret",
  "email": "dracula@count.com"
}`,
 o:["print(user_data[\"email\"])","if \"exp\" in user_data:\n    print(user_data[\"exp\"])","print(user_data.get(\"country\"))","if \"exp\" not in user_data:\n    print(user_data[\"exp\"])"],a:3,
 w:"کلید <code>\"exp\"</code> در دیکشنری وجود نداره. توی گزینه‌ی درست شرط <code>not in</code> باعث میشه دقیقاً وقتی کلید نیست بخوایم بهش دسترسی داشته باشیم و خطای <code>KeyError</code> بده. متد <code>get()</code> برای کلید ناموجود فقط <code>None</code> برمی‌گردونه و خطا نمیده."},

{t:"حلقه <code>for</code> در کد زیر چند بار اجرا میشه؟",p:3,
 code:`for i in range(100, 0, -20):
    print("")`,
 o:["10","5","120","100"],a:1,
 w:"<code>range(100, 0, -20)</code> مقدارهای 100، 80، 60، 40، 20 رو تولید می‌کنه و قبل از رسیدن به 0 تموم میشه. پس ۵ بار."},

{t:"از لیست شماره‌سریال‌ها با پیمایش، همه‌ی عناصر <code>\"NA\"</code> رو حذف کن و لیست رو چاپ کن.",p:8,
 code:`serial_numbers = [
    "A1023", "NA", "B2345", "C3920", "NA",
    "D4832", "E5839", "NA", "F6740", "G7501",
    "NA", "H8293", "I9021", "NA", "J0392"
]

for serial_number in serial_numbers:
    if serial_number == "NA":
        serial_numbers.remove("NA")

print(serial_numbers)`,
 out:"['A1023', 'B2345', 'C3920', 'D4832', 'E5839', 'F6740', 'G7501', 'H8293', 'I9021', 'J0392']",
 w:"این کد روی این داده درست جواب میده چون «NA»ها کنار هم نیستن. ولی حذف عنصر از لیست در حین پیمایش همون لیست خطرناکه و ممکنه عناصر رو جا بندازه (مثلاً دو <code>\"NA\"</code> پشت سر هم). روش امن‌تر: <code>serial_numbers = [s for s in serial_numbers if s != \"NA\"]</code> یا پیمایش روی کپی با <code>serial_numbers[:]</code>."},

{t:"کدوم یک از گزینه‌های زیر یک نام‌گذاری رایج‌تر برای اسم یک متغیره؟",p:3,
 o:["variable_name","VariableName","variableName","VARIABLE-NAME"],a:0,
 w:"در پایتون استاندارد (PEP 8) از <code>snake_case</code> یعنی حروف کوچک با زیرخط استفاده میشه. <code>VariableName</code> برای کلاس‌ها و <code>VARIABLE_NAME</code> برای ثابت‌هاست. خط تیره هم در اسم متغیر مجاز نیست."},

{t:"کد زیر بر اساس سن و قد چک می‌کنه که فرد می‌تونه سوار ترن هوایی بشه یا نه. خروجی کدوم گزینه‌ست؟",p:4,
 code:`height = 165
age = 18

if age > 12:
    if height > 170:
        print("از سواری لذت ببر")
    elif height > 160:
        print("با یک همراه می‌تونی سوار شی")
    else:
        print("باید یکم قدت بلندتر بشه تا بتونی سوار شی")
else:
    print("باید یکم سنت بیشتر شه تا بتونی سوار شی")`,

     sub:"مرور سوال‌ها، پاسخ‌ها و نکته‌های هر سوال: توابع، کلاس‌ها، فایل‌ها، pandas، numpy و تاریخ و زمان.",
     Q:Q2}
};

/* ========== ابزارها ========== */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fa = n => n.toLocaleString("fa-IR");
const LETTERS = ["الف","ب","ج","د","ه","و"];

const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const ICON_BULB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>';

/* هایلایت ساده‌ی پایتون */
const TOKEN = /(#[^\n]*)|("""[\s\S]*?"""|[fF]?"(?:\\.|[^"\\\n])*"|[fF]?'(?:\\.|[^'\\\n])*')|\b(\d+(?:\.\d+)?)\b|\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|as|from|try|except|with|break|continue|pass|lambda|None|True|False|is|raise|finally)\b|\b(print|len|range|int|str|float|list|map|filter|sum|input|open|dict|set|tuple|min|max)\b(?=\()|\b([A-Za-z_]\w*)(?=\()/g;
function highlight(src){
  let out = "", last = 0, m;
  TOKEN.lastIndex = 0;
  while((m = TOKEN.exec(src))){
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? "com" : m[2] ? "str" : m[3] ? "num" : m[4] ? "kw" : m[5] ? "bi" : "fn";
    out += `<span class="t-${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(src.slice(last));
}

function codeBlock(src, tag){
  return `<div class="code"><div class="code-bar"><span class="dots"><i></i><i></i><i></i></span><span class="lang">Python${tag ? `<em>${tag}</em>` : ""}</span><button type="button" class="copy">${ICON_COPY}<span>کپی</span></button></div><pre tabindex="0"><code>${highlight(src)}</code></pre></div>`;
}

function card(q, i){
  const hasOpts = Array.isArray(q.o);
  const code = q.code ? codeBlock(q.code, hasOpts ? "" : "پاسخ نمونه") : "";
  const opts = hasOpts
    ? `<ul class="opts">${q.o.map((x,j)=>`<li class="opt${q.a===j?" ok":""}"><span class="ltr">${LETTERS[j]||j+1}</span><code>${esc(x).replace(/\n/g,"<br>")}</code>${q.a===j?'<span class="ok-tag">پاسخ درست</span>':""}</li>`).join("")}</ul>`
    : "";
  const out = q.out ? `<div class="out"><div class="out-h">output</div><div class="out-b">${esc(q.out)}</div></div>` : "";
  return `<section class="q" style="--i:${Math.min(i,8)}">
    <div class="q-head"><div class="num">${fa(i+1)}</div><p class="q-text">${q.t}</p><span class="pts">${fa(q.p)} نمره</span></div>
    ${code}${opts}${out}
    <div class="why">${ICON_BULB}<div><b>نکته:</b> ${q.w}</div></div>
  </section>`;
}

/* ========== نمایش هر سطح ========== */
let current = 0;
function render(level, opts = {}){
  const L = LEVELS[level];
  if(!L) return;
  current = level;
  document.documentElement.dataset.level = level;
  document.title = `${L.title} | ایران دیجیتال`;
  const sw = $("#switch");
  sw.dataset.level = level;
  sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", String(+b.dataset.lv === level)));

  const total = L.Q.reduce((s,q)=>s+q.p, 0);
  const coding = L.Q.filter(q=>!Array.isArray(q.o)).length;
  const other = level === 1 ? 2 : 1;

  const app = $("#app");
  app.classList.remove("enter");
  app.innerHTML = `
    <div class="hero">
      <span class="eyebrow">${L.badge}</span>
      <h1>${L.title}</h1>
      <p>${L.sub}</p>
      <div class="stats">
        <div class="stat"><b>${fa(L.Q.length)}</b><span>سوال</span></div>
        <div class="stat"><b>${fa(total)}</b><span>مجموع نمره</span></div>
        <div class="stat"><b>${fa(coding)}</b><span>سوال کدنویسی</span></div>
      </div>
    </div>
    <div id="list">${L.Q.map(card).join("")}</div>
    <div class="next"><button type="button" data-lv="${other}">رفتن به ${LEVELS[other].badge.split(" • ")[0]} ←</button></div>`;
  void app.offsetWidth;
  app.classList.add("enter");

  if(!opts.silent){
    try{ localStorage.setItem("jozve-level", level); }catch(e){}
    try{ history.replaceState(null, "", "#level-" + level); }catch(e){}
    window.scrollTo({top:0, behavior:"smooth"});
  }
  updateBar();
}

/* ========== رویدادها ========== */
document.addEventListener("click", e => {
  const lv = e.target.closest("[data-lv]");
  if(lv){ const n = +lv.dataset.lv; if(n !== current) render(n); return; }

  const btn = e.target.closest(".copy");
  if(btn){
    const text = btn.closest(".code").querySelector("pre").textContent;
    const done = () => {
      const label = btn.querySelector("span");
      label.textContent = "کپی شد ✓"; btn.classList.add("done");
      setTimeout(()=>{ label.textContent = "کپی"; btn.classList.remove("done"); }, 1500);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, () => { fallbackCopy(text); done(); });
    }else{ fallbackCopy(text); done(); }
  }
});
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  ta.remove();
}

/* Ctrl+A داخل کادر کد فقط همون کادر رو انتخاب کنه */
document.addEventListener("keydown", e => {
  if(!(e.ctrlKey || e.metaKey)) return;
  if(!(e.code === "KeyA" || (e.key && e.key.toLowerCase() === "a"))) return;
  const sel = getSelection();
  let pre = document.activeElement && document.activeElement.closest ? document.activeElement.closest("pre") : null;
  if(!pre && sel.anchorNode){
    const el = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    pre = el && el.closest ? el.closest("pre") : null;
  }
  if(!pre) return;
  e.preventDefault();
  const r = document.createRange();
  r.selectNodeContents(pre.querySelector("code"));
  sel.removeAllRanges(); sel.addRange(r);
});

/* نوار پیشرفت مطالعه */
function updateBar(){
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  $("#bar").style.transform = `scaleX(${max > 0 ? Math.min(1, h.scrollTop / max) : 0})`;
}
addEventListener("scroll", updateBar, {passive:true});
addEventListener("resize", updateBar);

/* سطح اولیه: هش آدرس > حافظه‌ی مرورگر > سطح ۱ */
(function init(){
  let lv = 1;
  const m = location.hash.match(/level-(\d)/);
  if(m && LEVELS[+m[1]]) lv = +m[1];
  else{ try{ const s = +localStorage.getItem("jozve-level"); if(LEVELS[s]) lv = s; }catch(e){} }
  render(lv, {silent:true});
})();
addEventListener("hashchange", () => {
  const m = location.hash.match(/level-(\d)/);
  if(m && LEVELS[+m[1]] && +m[1] !== current) render(+m[1]);
});
</script>
</body>
</html>
