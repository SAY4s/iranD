<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جزوه امتحان مقدماتی | ایران دیجیتال</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --ink:#1c2233; --muted:#6b7285; --line:#e3e6ee;
  --brand:#3b5bdb; --ok:#1b8a5a; --ok-bg:#e6f6ee; --code-bg:#1e2230; --code-ink:#e6e9f2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9}
header{background:var(--brand);color:#fff;padding:28px 16px 24px;text-align:center}
header h1{margin:0 0 4px;font-size:1.35rem}
header p{margin:0;opacity:.85;font-size:.9rem}
main{max-width:760px;margin:0 auto;padding:16px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.q-head{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.q-text{flex:1;margin:0}
.pts{color:var(--muted);font-size:.8rem;white-space:nowrap}
pre{direction:ltr;text-align:left;background:var(--code-bg);color:var(--code-ink);padding:12px 14px;border-radius:10px;overflow-x:auto;font-size:.85rem;line-height:1.6;margin:12px 0}
code{font-family:Consolas,"Courier New",monospace;direction:ltr;unicode-bidi:embed}
p code,li code{background:#eef0f7;padding:1px 6px;border-radius:5px;font-size:.88em}
ul.opts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
ul.opts li{border:1px solid var(--line);border-radius:10px;padding:6px 12px}
ul.opts li.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
ul.opts li.ok::before{content:"✓ "}
.why{margin-top:12px;padding:10px 12px;border-right:4px solid var(--brand);background:#eef1fd;border-radius:8px;font-size:.92rem}
.why b{color:var(--brand)}
.out{direction:ltr;text-align:left;font-family:Consolas,monospace;background:#eef0f7;border-radius:8px;padding:6px 10px;margin-top:8px;font-size:.85rem;white-space:pre-wrap}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px 16px 40px}
@media print{header{background:none;color:#000}.q{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>جزوه امتحان مقدماتی</h1>
  <p>ایران دیجیتال • مرور سوال‌ها، پاسخ‌ها و نکته‌های هر سوال</p>
</header>
<main id="app"></main>
<footer>این جزوه برای مرور شخصی ساخته شده است.</footer>

<script>
const Q = [
{t:"کدوم یک از گزینه‌های زیر، تعداد عناصر لیست <code>[1, 2, 3, 4, 5]</code> رو به درستی محاسبه می‌کنه؟",p:3,
 o:["length([1, 2, 3, 4, 5])","items([1, 2, 3, 4, 5])","len([1, 2, 3, 4, 5])","itm([1, 2, 3, 4, 5])"],a:2,
 w:"تابع داخلی پایتون برای شمردن عناصر <code>len()</code> هست و روی لیست، رشته، دیکشنری و تاپل کار می‌کنه."},

{t:"دستور <code>print</code> نوشته شده در کد زیر چند بار اجرا میشه؟",p:5,
 code:`for i in range(10):
    for j in range(10):
        for k in range(5):
            print("Hello World")`,
 o:["1000","5000","100","500"],a:3,
 w:"در حلقه‌های تو در تو، تعداد اجرا برابر حاصل‌ضرب تکرارهاست: <code>10 × 10 × 5 = 500</code>."},

{t:"با اجرا کردن کد زیر چه چیزی در خروجی چاپ میشه؟",p:3,
 code:`counter = 1

while counter <= 10:
    print(1)
    counter -= 1
else:
    print("done")`,
 o:["اعداد 1 تا 10 و در آخر رشته done در خروجی چاپ میشن.","اعداد 10 تا 1 و در آخر رشته done در خروجی چاپ میشن.","کد خطا داره و اصلاً اجرا نمیشه.","حلقه بی‌نهایته و تا ابد 1 در خروجی چاپ میشه."],a:3,
 w:"به‌جای <code>+= 1</code> نوشته شده <code>-= 1</code>، پس <code>counter</code> هر بار کمتر میشه و شرط <code>counter &lt;= 10</code> همیشه درست می‌مونه. حلقه هیچ‌وقت تموم نمیشه و <code>else</code> هم اجرا نمیشه."},

{t:"برنامه‌ی پیشنهاد نام کاربری: نام و سن رو بگیر و با <code>_</code> بینشون و <code>!</code> در آخر، نام کاربری بساز و چاپ کن. (مثلاً <code>\"nina_24!\"</code>)",p:6,
 code:`name = input("نام: ")
age = input("سن: ")

username = name + "_" + age + "!"

print(username)`,
 w:"خروجی <code>input()</code> همیشه رشته‌ست، پس نیازی به تبدیل <code>age</code> به عدد نیست و با <code>+</code> مستقیم می‌چسبه. اگه می‌خواستی عدد باشه، باید با <code>str()</code> تبدیلش می‌کردی."},

{t:"کدوم یک از گزینه‌های زیر برای حذف کردن یک عنصر از دیکشنری استفاده <b>نمیشه</b>؟",p:3,
 o:["del","pop","popitem","remove"],a:3,
 w:"دیکشنری متد <code>remove</code> نداره. روش‌های درست: <code>del d[key]</code>، <code>d.pop(key)</code> و <code>d.popitem()</code> (آخرین عنصر رو حذف می‌کنه). <code>remove</code> مخصوص لیست‌هاست."},

{t:"با توجه به دیکشنری زیر، اجرای کدوم قطعه کد با مشکل مواجه میشه؟",p:4,
 code:`user_data = {
  "user_name": "dracula",
  "password": "secret",
  "email": "dracula@count.com"
}`,
 o:["print(user_data[\"email\"])","if \"exp\" in user_data:\n    print(user_data[\"exp\"])","print(user_data.get(\"country\"))","if \"exp\" not in user_data:\n    print(user_data[\"exp\"])"],a:3,
 w:"کلید <code>\"exp\"</code> در دیکشنری وجود نداره. توی گزینه‌ی درست شرط <code>not in</code> باعث میشه دقیقاً وقتی کلید نیست بخوایم بهش دسترسی داشته باشیم و خطای <code>KeyError</code> بده. متد <code>get()</code> برای کلید ناموجود فقط <code>None</code> برمی‌گردونه و خطا نمیده."},

{t:"حلقه <code>for</code> در کد زیر چند بار اجرا میشه؟",p:3,
 code:`for i in range(100, 0, -20):
    print("")`,
 o:["10","5","120","100"],a:1,
 w:"<code>range(100, 0, -20)</code> مقدارهای 100، 80، 60، 40، 20 رو تولید می‌کنه و قبل از رسیدن به 0 تموم میشه. پس ۵ بار."},

{t:"از لیست شماره‌سریال‌ها با پیمایش، همه‌ی عناصر <code>\"NA\"</code> رو حذف کن و لیست رو چاپ کن.",p:8,
 code:`serial_numbers = [
    "A1023", "NA", "B2345", "C3920", "NA",
    "D4832", "E5839", "NA", "F6740", "G7501",
    "NA", "H8293", "I9021", "NA", "J0392"
]

for serial_number in serial_numbers:
    if serial_number == "NA":
        serial_numbers.remove("NA")

print(serial_numbers)`,
 out:"['A1023', 'B2345', 'C3920', 'D4832', 'E5839', 'F6740', 'G7501', 'H8293', 'I9021', 'J0392']",
 w:"این کد روی این داده درست جواب میده چون «NA»ها کنار هم نیستن. ولی حذف عنصر از لیست در حین پیمایش همون لیست خطرناکه و ممکنه عناصر رو جا بندازه (مثلاً دو <code>\"NA\"</code> پشت سر هم). روش امن‌تر: <code>serial_numbers = [s for s in serial_numbers if s != \"NA\"]</code> یا پیمایش روی کپی با <code>serial_numbers[:]</code>."},

{t:"کدوم یک از گزینه‌های زیر یک نام‌گذاری رایج‌تر برای اسم یک متغیره؟",p:3,
 o:["variable_name","VariableName","variableName","VARIABLE-NAME"],a:0,
 w:"در پایتون استاندارد (PEP 8) از <code>snake_case</code> یعنی حروف کوچک با زیرخط استفاده میشه. <code>VariableName</code> برای کلاس‌ها و <code>VARIABLE_NAME</code> برای ثابت‌هاست. خط تیره هم در اسم متغیر مجاز نیست."},

{t:"کد زیر بر اساس سن و قد چک می‌کنه که فرد می‌تونه سوار ترن هوایی بشه یا نه. خروجی کدوم گزینه‌ست؟",p:4,
 code:`height = 165
age = 18

if age > 12:
    if height > 170:
        print("از سواری لذت ببر")
    elif height > 160:
        print("با یک همراه می‌تونی سوار شی")
    else:
        print("باید یکم قدت بلندتر بشه تا بتونی سوار شی")
else:
    print("باید یکم سنت بیشتر شه تا بتونی سوار شی")`,
 o:["از سواری لذت ببر","با یک همراه می‌تونی سوار شی","باید یکم قدت بلندتر بشه تا بتونی سوار شی","باید یکم سنت بیشتر شه تا بتونی سوار شی"],a:1,
 w:"سن 18 بزرگ‌تر از 12 هست، پس وارد شرط اول میشیم. قد 165 بزرگ‌تر از 170 نیست ولی بزرگ‌تر از 160 هست، پس شاخه‌ی <code>elif</code> اجرا میشه."},

{t:"خروجی کدوم گزینه با بقیه‌ی گزینه‌ها فرق داره؟",p:3,
 o:["True and True","False or True","not True","not False"],a:2,
 w:"<code>True and True</code> میشه <code>True</code>، <code>False or True</code> میشه <code>True</code>، <code>not False</code> میشه <code>True</code> ولی <code>not True</code> میشه <code>False</code>."},

{t:"کدی بنویس که همه‌ی اعداد 1 تا 100 رو چاپ کنه، اما اعدادی که بر 4 بخش‌پذیرن رو <b>چاپ نکنه</b>.",p:8,
 code:`for i in range(1, 101):
    if i % 4 != 0:
        print(i)`,
 w:"<code>range(1, 101)</code> تا 100 می‌ره (عدد آخر شامل نمیشه). عملگر <code>%</code> باقی‌مانده رو میده و اگه باقی‌مانده‌ی تقسیم بر 4 صفر نباشه، یعنی بخش‌پذیر نیست."},

{t:"خروجی کد زیر در کدوم گزینه آورده شده؟",p:5,
 code:`list_1 = [5, 6, 3, 88]
list_2 = [5, 6, 88, 3]
flag = ""

for i in range(len(list_1)):
    if list_1[i] == list_2[i]:
        flag += "1"
    else:
        break

print(flag)`,
 o:["1","11","111","1111"],a:1,
 w:"اندیس‌های 0 و 1 مقدار برابر دارن (5 و 6) پس دو بار <code>\"1\"</code> اضافه میشه. در اندیس 2 مقدارها 3 و 88 هستن و برابر نیستن، پس <code>break</code> حلقه رو قطع می‌کنه. نتیجه <code>\"11\"</code>."},

{t:"برای کامنت کردن یک خط از کد، از کدوم کاراکتر استفاده میشه؟",p:3,
 o:["//","*/","#","--"],a:2,
 w:"در پایتون کامنت تک‌خطی با <code>#</code> شروع میشه. <code>//</code> در پایتون عملگر تقسیم صحیحه."},

{t:"تفاوت بین تاپل‌ها و لیست‌ها در چیه؟",p:4,
 o:["هیچ تفاوتی ندارن.","از تاپل‌ها برای ذخیره مقادیر عددی استفاده میشه ولی از لیست‌ها نه.","لیست‌ها تغییرپذیر نیستن اما تاپل‌ها هستن.","تاپل‌ها تغییرپذیر نیستن اما لیست‌ها هستن."],a:3,
 w:"تاپل (<code>(1, 2, 3)</code>) تغییرناپذیره (immutable) و بعد از ساخت نمیشه عناصرش رو عوض کرد. لیست (<code>[1, 2, 3]</code>) تغییرپذیره (mutable)."},

{t:"دیکشنری <code>frequency</code> رو تعریف کن که کلیدهاش عناصر لیست <code>chars</code> و مقدار هر کلید، تعداد تکرار اون کاراکتر باشه. باید روی لیست پیمایش کنی.",p:9,
 code:`chars = ['a', 'b', 'a', 'c', 'd', 'e', 'b',
         'a', 'e', 'f', 'g', 'd', 'h', 'e', 'f']

frequency = {}
for char in chars:
    if char not in frequency:
        frequency.update({char: chars.count(char)})

print(frequency)`,
 out:"{'a': 3, 'b': 2, 'c': 1, 'd': 2, 'e': 3, 'f': 2, 'g': 1, 'h': 1}",
 w:"با شرط <code>char not in frequency</code> هر کاراکتر فقط یک بار ثبت میشه و <code>chars.count(char)</code> تعداد تکرارش رو میده. روش رایج دیگه: <code>frequency[char] = frequency.get(char, 0) + 1</code>."},

{t:"برای اینکه رشته‌ی <code>\"iterator\"</code> در متغیر <code>word</code> رو به <code>\"iferafor\"</code> تبدیل کنیم، از چه روشی استفاده کنیم؟",p:3,
 o:["word.replace(\"f\", \"t\")","word.replace(\"f\", \"r\")","word.replace(\"t\", \"f\")","word.replace(\"t\", \"r\")"],a:2,
 w:"<code>replace(قدیمی, جدید)</code> همه‌ی «t»ها رو با «f» عوض می‌کنه: <code>iterator ← iferafor</code>. توجه کن که <code>replace</code> رشته‌ی جدید برمی‌گردونه و رشته‌ی اصلی تغییر نمی‌کنه (رشته‌ها تغییرناپذیرن)."},

{t:"کدوم جمله راجع به رشته‌ها در پایتون غلطه؟",p:4,
 o:["رشته‌ها دنباله‌ای از کاراکترها هستن که داخل علامت نقل قول قرار می‌گیرن.","می‌تونیم با استفاده از عملگر + دو رشته رو به هم بچسبونیم.","یک رشته رو نمیشه به صورت مستقیم به یک مقدار با نوع int چسبوند.","هیچ کدام"],a:3,
 w:"هر سه جمله درسته. مورد سوم هم درسته: <code>\"a\" + 5</code> خطای <code>TypeError</code> میده و باید اول <code>str(5)</code> کنی. پس هیچ‌کدوم غلط نیست."},

{t:"۲۰ داده‌ی دمای حسگر داری. میانگین داده‌های بالاتر از 73.5 رو منهای میانگین داده‌های کوچک‌تر یا مساوی 73.5 کن و بدون رند کردن چاپ کن.",p:10,
 code:`temperatures = [
    72.38, 72.83, 73.12, 73.61, 72.97,
    73.74, 73.00, 72.56, 73.43, 72.11,
    73.98, 72.04, 72.64, 73.35, 73.89,
    72.20, 73.50, 72.41, 73.29, 72.78
]
greater_73_5 = []
less_equal_73_5 = []
for temperature in temperatures:
    if temperature > 73.5:
        greater_73_5.append(temperature)
    else:
        less_equal_73_5.append(temperature)

avg_greater = sum(greater_73_5) / len(greater_73_5)
avg_less_equal = sum(less_equal_73_5) / len(less_equal_73_5)

print(avg_greater - avg_less_equal)`,
 out:"1.0168749999999989",
 w:"داده‌ها در دو لیست جدا میشن (به <code>73.50</code> دقت کن که به لیست «کوچک‌تر یا مساوی» میره). میانگین هر لیست با <code>sum / len</code> حساب میشه. خروجی طولانی به خاطر خطای ذاتی اعداد اعشاری در کامپیوتره و رند نکردن خواسته‌ی سوال بوده."},

{t:"نمرات دانش‌آموز در دیکشنری <code>scores</code> ذخیره شده. با پیمایش روی دیکشنری معدل رو حساب و چاپ کن.",p:9,
 code:`scores = {
    "Math": 95,
    "Physics": 80,
    "Chemistry": 86,
    "Geometry": 98,
    "Algebra": 93
}
summation = 0
for score in scores:
    summation += scores[score]
avg = summation / len(scores)

print(avg)`,
 out:"90.4",
 w:"پیمایش مستقیم روی دیکشنری، کلیدها رو میده و با <code>scores[score]</code> به مقدار هر کلید می‌رسیم. مجموع ۴۵۲ تقسیم بر ۵ درس میشه ۹۰.۴. راه کوتاه‌تر: <code>sum(scores.values()) / len(scores)</code>."}
];

const app = document.getElementById("app");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
app.innerHTML = Q.map((q,i)=>{
  const opts = q.o ? `<ul class="opts">${q.o.map((x,j)=>`<li class="${j===q.a?"ok":""}"><code>${esc(x).replace(/\n/g,"<br>")}</code></li>`).join("")}</ul>` : "";
  const code = q.code ? `<pre><code>${esc(q.code)}</code></pre>` : "";
  const out = q.out ? `<div class="out">خروجی: ${esc(q.out)}</div>` : "";
  return `<section class="q"><div class="q-head"><div class="num">${i+1}</div><p class="q-text">${q.t}</p><span class="pts">${q.p} نمره</span></div>${code}${opts}${out}<div class="why"><b>نکته:</b> ${q.w}</div></section>`;
}).join("");
</script>
</body>
</html>
